<!DOCTYPE html>
<!--
  《青溪问道》 Web page (Unity WebGL template "PROJECT:Qingxi", set by Assets/Editor/WebPlayerSettings.cs).
  Made for iPhone Safari in landscape: the game fills the screen inside the safe areas (notch, home bar), a portrait
  phone is asked to turn sideways, page zoom / scroll / text selection are off so touches reach the game, and the
  canvas renders at most at 1.5× the CSS pixels on phones (?dpr=2 or ?dpr=1 overrides). Errors show on the page.
  Uses only the template variables of Unity 6000.3.26f1's own Base/Default template (checked against the WebGL
  support module): DATA/FRAMEWORK/CODE/LOADER/WORKER/SYMBOLS_FILENAME, USE_THREADS, USE_WASM, COMPANY_NAME,
  PRODUCT_NAME, PRODUCT_VERSION.
  tools/web/make_page.py fills in the template fields for an already built game (e.g. Build #3) without Unity.
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="青溪问道">
<meta name="theme-color" content="#0d1110">
<title>青溪问道</title>
<style>
  :root { --ink: #0d1110; --paper: #f2eee2; --jade: #8cd9b8; --gold: #e0bd6b; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--ink); color: var(--paper); overflow: hidden;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: "Songti SC", "Noto Serif SC", "PingFang SC", serif; }
  #stage { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; box-sizing: border-box;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background: var(--ink); }
  #unity-canvas { display: block; width: 100%; height: 100%; background: var(--ink); touch-action: none; outline: none; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--ink); }
  #loading h1 { margin: 0; font-size: 30px; letter-spacing: 0.4em; color: var(--paper); font-weight: 600; }
  #loading p { margin: 0; font-size: 14px; color: #a8a99c; }
  #bar { width: min(60vw, 420px); height: 6px; border-radius: 3px; background: #2a302d; overflow: hidden; }
  #fill { width: 0; height: 100%; background: linear-gradient(90deg, var(--jade), var(--gold)); transition: width 0.2s; }
  #error { position: fixed; left: 12px; right: 12px; bottom: 12px; padding: 10px 12px; border-radius: 6px; background: #5a1d17; color: #fff; font: 13px/1.5 monospace;
    white-space: pre-wrap; display: none; max-height: 40vh; overflow: auto; z-index: 10; }
  #rotate { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: var(--ink); z-index: 20; text-align: center; padding: 24px; }
  #rotate .phone { width: 44px; height: 76px; border: 3px solid var(--paper); border-radius: 9px; animation: turn 2.4s ease-in-out infinite; }
  @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
  #rotate p { margin: 0; font-size: 17px; line-height: 1.7; }
  #rotate small { color: #a8a99c; font-size: 13px; }
  @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="stage"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
<div id="loading"><h1>青溪问道</h1><div id="bar"><div id="fill"></div></div><p id="status">加载中…</p><p><a href="credits.html" style="color:#8cd9b8;font-size:13px">素材与许可</a></p></div>
<div id="rotate"><div class="phone"></div><p>请将手机横置</p><small>在 Safari 里点「分享」→「添加到主屏幕」，从主屏幕打开可全屏游玩</small></div>
<div id="error"></div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var isPhone = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
  var dpr = parseFloat(params.get("dpr")) || Math.min(window.devicePixelRatio || 1, isPhone ? 1.5 : 2);
  var canvas = document.getElementById("unity-canvas");
  var errorBox = document.getElementById("error");
  function showError(msg) { errorBox.style.display = "block"; errorBox.textContent += msg + "\n"; }
  window.addEventListener("error", function (e) { showError("错误：" + (e.message || e)); });

  // keep Safari's own gestures (pinch zoom, double-tap zoom, rubber-band scroll) away from the game
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false }); });
  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
  var lastTouchEnd = 0;
  document.addEventListener("touchend", function (e) { var now = Date.now(); if (now - lastTouchEnd < 350) e.preventDefault(); lastTouchEnd = now; }, { passive: false });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  var buildUrl = "Build";
  var config = {
    dataUrl: buildUrl + "/Default WebGL.data",
    frameworkUrl: buildUrl + "/Default WebGL.framework.js",
    codeUrl: buildUrl + "/Default WebGL.wasm",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "Qingxi",
    productName: "Qingxi",
    productVersion: "build-3",
    devicePixelRatio: dpr,
    matchWebGLToCanvasSize: true,
    showBanner: function (msg, type) { if (type === "error") showError(msg); else console.log(msg); }
  };

  var script = document.createElement("script");
  script.src = buildUrl + "/Default WebGL.loader.js";
  script.onload = function () {
    createUnityInstance(canvas, config, function (p) {
      document.getElementById("fill").style.width = Math.round(p * 100) + "%";
      document.getElementById("status").textContent = p < 0.9 ? "加载中 " + Math.round(p * 100) + "%" : "搭建青溪山涧…";
    }).then(function (instance) {
      document.getElementById("loading").style.display = "none";
      window.unityInstance = instance;
      canvas.focus();
    }).catch(function (message) { showError("游戏无法启动：" + message); });
  };
  script.onerror = function () { showError("找不到游戏文件：" + script.src); };
  document.body.appendChild(script);
})();
</script>
</body>
</html>
